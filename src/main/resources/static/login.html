<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <title>Login - ShowUp2Move</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f0f2f5; height: 100vh; display: flex; align-items: center; justify-content: center; }
        .login-card { width: 100%; max-width: 400px; border-radius: 15px; border: none; box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
    </style>
</head>
<body>

<div class="card login-card p-4">
    <h2 class="text-center mb-4 fw-bold text-primary">ShowUp2Move</h2>
    <p class="text-center text-muted">Enter your name to log in</p>
    <form id="loginForm">
        <div class="mb-3">
            <input type="text" id="userName" class="form-control form-control-lg" placeholder="Numele tău (ex: Andrei)" required>
        </div>
        <button type="submit" class="btn btn-primary w-100 btn-lg fw-bold">Login</button>
        <div class="text-center mt-3">
            <a href="register.html" class="text-decoration-none">Don't have an account? Register here</a>
        </div>
    </form>
</div>

<script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const name = document.getElementById('userName').value;

        // Căutăm userul în baza de date după nume
        const response = await fetch('/api/users');
        const users = await response.json();
        
        const user = users.find(u => u.name.toLowerCase() === name.toLowerCase());

        if (user) {
            // Salvăm datele userului în browser ca să știm cine este logat
            localStorage.setItem('loggedUser', JSON.stringify(user));
            window.location.href = 'index.html';
        } else {
            alert('User not found. Please register.');
        }
    });
</script>
</body>
</html>
