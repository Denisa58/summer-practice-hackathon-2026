<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Profile - ShowUp2Move</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f0f2f5; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .register-container { max-width: 600px; margin: 50px auto; }
        .card { border: none; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
        .btn-primary { background: linear-gradient(135deg, #007bff, #6610f2); border: none; padding: 12px; font-weight: bold; }
        .sport-chip { transition: all 0.3s; cursor: pointer; }
        .form-check-input:checked + .form-check-label { color: #007bff; font-weight: bold; }
    </style>
</head>
<body>

<div class="container register-container">
    <div class="card p-4">
        <div class="text-center mb-4">
            <h2 class="fw-bold">Create Profile 🚀</h2>
            <p class="text-muted">Set up your account to start moving!</p>
        </div>

        <form id="registerForm">
            <div class="mb-3">
                <label class="form-label fw-bold">Full Name</label>
                <input type="text" id="name" class="form-control" placeholder="Enter your name" required>
            </div>

            <div class="mb-3">
                <label class="form-label fw-bold">Bio Description</label>
                <textarea id="bio" class="form-control" rows="3" placeholder="Ex: I love playing football and hitting the hoops at the court..."></textarea>
                <button type="button" class="btn btn-sm btn-outline-primary mt-2" onclick="magicAiFill()">
                    ✨ Suggest sports from Bio
                </button>
            </div>

            <div class="mb-4" id="sports-container">
                <label class="form-label fw-bold d-block mb-2">Favorite Sports</label>
                <div class="d-flex flex-wrap gap-2">
                    <div class="form-check border p-2 rounded sport-chip">
                        <input class="form-check-input ms-0" type="checkbox" value="Football" id="s-foot">
                        <label class="form-check-label ms-2" for="s-foot">Football ⚽</label>
                    </div>
                    <div class="form-check border p-2 rounded sport-chip">
                        <input class="form-check-input ms-0" type="checkbox" value="Basketball" id="s-basket">
                        <label class="form-check-label ms-2" for="s-basket">Basketball 🏀</label>
                    </div>
                    <div class="form-check border p-2 rounded sport-chip">
                        <input class="form-check-input ms-0" type="checkbox" value="Tennis" id="s-tennis">
                        <label class="form-check-label ms-2" for="s-tennis">Tennis 🎾</label>
                    </div>
                    <div class="form-check border p-2 rounded sport-chip">
                        <input class="form-check-input ms-0" type="checkbox" value="Volleyball" id="s-volley">
                        <label class="form-check-label ms-2" for="s-volley">Volleyball 🏐</label>
                    </div>
                    <div class="form-check border p-2 rounded sport-chip">
                        <input class="form-check-input ms-0" type="checkbox" value="Swimming" id="s-swim">
                        <label class="form-check-label ms-2" for="s-swim">Swimming 🏊</label>
                    </div>
                </div>
            </div>

            <div class="mb-4">
                <label class="form-label fw-bold">Skill Level</label>
                <select id="skillLevel" class="form-select">
                    <option value="Beginner 🥚">Beginner 🥚</option>
                    <option value="Intermediate 🐣">Intermediate 🐣</option>
                    <option value="Advanced 🦅">Advanced 🦅</option>
                </select>
            </div>

            <button type="submit" class="btn btn-primary w-100 rounded-pill">Finalize Registration</button>
            <div class="text-center mt-3">
                <a href="login.html" class="text-decoration-none small">Back to Login</a>
            </div>
        </form>
    </div>
</div>

<script>
    // 1. FUNCȚIA MAGICĂ AI (500p)
    async function magicAiFill() {
        const bioText = document.getElementById('bio').value;
        if (!bioText) {
            alert("Please write a short bio first!");
            return;
        }

        try {
            const response = await fetch('/api/users/analyze-bio', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ bio: bioText })
            });

            const detectedSports = await response.json();

            if (detectedSports.length > 0) {
                // Debifăm tot înainte de a aplica sugestia AI
                document.querySelectorAll('#sports-container input[type="checkbox"]').forEach(cb => cb.checked = false);

                // Bifăm sporturile detectate
                detectedSports.forEach(sport => {
                    const checkbox = document.querySelector(`#sports-container input[value="${sport}"]`);
                    if (checkbox) checkbox.checked = true;
                });
                
                console.log("AI automatically selected:", detectedSports);
            } else {
                alert("AI couldn't detect specific sports. Try using words like 'pitch', 'court', 'pool' or 'hoops'!");
            }
        } catch (error) {
            console.error("AI Error:", error);
            alert("Could not connect to the AI engine.");
        }
    }

    // 2. LOGICA DE ÎNREGISTRARE (Salvare în DB)
    document.getElementById('registerForm').addEventListener('submit', async (e) => {
        e.preventDefault();

        const name = document.getElementById('name').value;
        const bio = document.getElementById('bio').value;
        const skillLevel = document.getElementById('skillLevel').value;
        
        // Colectăm sporturile bifate
        const selectedSports = Array.from(document.querySelectorAll('#sports-container input:checked'))
                                    .map(cb => cb.value);

        const userData = {
            name: name,
            bio: bio,
            skillLevel: skillLevel,
            sports: selectedSports,
            available: false // Începe ca unavailable
        };

        try {
            const response = await fetch('/api/users', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(userData)
            });

            if (response.ok) {
                const savedUser = await response.json();
                localStorage.setItem('loggedUser', JSON.stringify(savedUser));
                alert("Account created successfully!");
                window.location.href = 'index.html';
            } else {
                alert("Failed to create account.");
            }
        } catch (error) {
            console.error("Error:", error);
            alert("Server connection error.");
        }
    });
</script>

</body>
</html>
