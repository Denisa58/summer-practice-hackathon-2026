<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - ShowUp2Move</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f0f2f5; }
        .register-container { max-width: 500px; margin-top: 50px; }
        .card { border-radius: 15px; border: none; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
    </style>
</head>
<body>

<div class="container register-container">
    <div class="card p-4">
        <h2 class="text-center mb-4 fw-bold text-primary">Create Profile 🚀</h2>
        <form id="registerForm">
            <div class="mb-3">
                <label class="form-label fw-bold">Full Name</label>
                <input type="text" id="name" class="form-control" placeholder="What's your name?" required>
            </div>
            
            
                <label>Bio Description</label>
                <textarea id="bio" class="form-control" placeholder="Ex: I love playing football and tennis..."></textarea>
                <button type="button" class="btn btn-sm btn-outline-secondary mt-2" onclick="magicAiFill()">
                    ✨ Suggest sports from Bio
                </button>
            </div>

            <div id="sports-checkboxes">
                <input type="checkbox" value="Football"> Football
                <input type="checkbox" value="Basketball"> Basketball
                <input type="checkbox" value="Tennis"> Tennis
            </div>

            <div class="mb-3">
                <label class="form-label fw-bold">Skill Level</label>
                <select id="skillLevel" class="form-select">
                    <option value="Beginner">Beginner 🥚</option>
                    <option value="Intermediate">Intermediate 🐥</option>
                    <option value="Advanced">Advanced 🦅</option>
                    <option value="Pro">Pro 🔥</option>
                </select>
            </div>

            <div class="mb-3">
                <label class="form-label fw-bold">Favorite Sports</label>
                <div class="d-flex flex-wrap gap-2">
                    <div class="form-check border p-2 rounded">
                        <input class="form-check-input ms-0" type="checkbox" value="Football" name="sport">
                        <label class="form-check-label ms-1">Football ⚽</label>
                    </div>
                    <div class="form-check border p-2 rounded">
                        <input class="form-check-input ms-0" type="checkbox" value="Tenis" name="sport">
                        <label class="form-check-label ms-1">Tennis 🎾</label>
                    </div>
                    <div class="form-check border p-2 rounded">
                        <input class="form-check-input ms-0" type="checkbox" value="Baschet" name="sport">
                        <label class="form-check-label ms-1">Basketball 🏀</label>
                    </div>
                    <div class="form-check border p-2 rounded">
                        <input class="form-check-input ms-0" type="checkbox" value="Volei" name="sport">
                        <label class="form-check-label ms-1">Volleyball 🏐</label>
                    </div>
                </div>
            </div>

            <button type="submit" class="btn btn-primary w-100 btn-lg fw-bold mt-3">Finalize Registration</button>
            <a href="index.html" class="btn btn-link w-100 mt-2 text-decoration-none text-muted">Back to List</a>
        </form>
    </div>
</div>

<script>
    document.getElementById('registerForm').addEventListener('submit', async (e) => {
        e.preventDefault();

        // Colectăm sporturile selectate într-un Array (List în Java)
        const selectedSports = Array.from(document.querySelectorAll('input[name="sport"]:checked'))
                                    .map(cb => cb.value);

        const userData = {
            name: document.getElementById('name').value,
            bio: document.getElementById('bio').value,
            skillLevel: document.getElementById('skillLevel').value,
            sports: selectedSports, // Trimite ca List<String>
            available: true
        };

        try {
            const response = await fetch('/api/users', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(userData)
            });

            if (response.ok) {
                alert('Profile created successfully! Redirecting to the list...');
                window.location.href = 'index.html';
            } else {
                alert('Failed to create profile. Please try again.');
            }
        } catch (error) {
            console.error("Eroare:", error);
        }
    });
    async function magicAiFill() {
    const bioText = document.getElementById('bio').value;
    if(!bioText) return alert("Please write something in Bio first!");

    const response = await fetch('/api/users/analyze-bio', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ bio: bioText })
    });
    
    const detected = await response.json();
    
    if(detected.length > 0) {
        // Debifăm tot înainte
        document.querySelectorAll('#sports-checkboxes input').forEach(i => i.checked = false);
        
        // Bifăm ce a găsit AI-ul
        detected.forEach(sport => {
            const el = document.querySelector(`input[value="${sport}"]`);
            if(el) el.checked = true;
        });
        alert("AI detected: " + detected.join(", "));
    } else {
        alert("AI couldn't find sports in your bio. Try being more specific!");
    }
}
</script>

</body>
</html>
